name: Auto IPTV Sync

on:
  schedule:
    # 每天定时运行一次（你可以改成 '0 */6 * * *' 表示每6小时运行一次）
    - cron: '0 0 * * *'
  workflow_dispatch:      # 允许你在 GitHub 网页上随时手动点击“立即运行”

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 赋予写入仓库权限，确保能自动提交更新

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行 p3p 源转换脚本
        run: python convert_p3p.py

      - name: 自动提交并推送 total_live.txt 更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add total_live.txt
          git commit -m "Auto-update total_live.txt via GitHub Actions" || echo "No changes to commit"
          git push
